name: Backend

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hacker_news
          POSTGRES_USER: hacker_news
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hacker_news -d hacker_news"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hacker_news:local_test_password@localhost:5432/hacker_news
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app tests
      - run: uv run --locked pytest

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: compose_test_database
      POSTGRES_USER: compose_test_user
      # Disposable credentials also exercise reserved characters in the password.
      POSTGRES_PASSWORD: 'compose@test/password:%?#$'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent http://127.0.0.1:8000/health | grep -Fx '{"status":"ok"}'
      - name: Check entries validation without upstream access
        run: |
          curl --silent --show-error --output /tmp/entries-error.json --write-out '%{http_code}' \
            'http://127.0.0.1:8000/api/v1/entries?filter=invalid' | grep -Fx '422'
          python - <<'PY'
          import json
          from uuid import UUID

          with open('/tmp/entries-error.json') as response:
              body = json.load(response)
          UUID(body['request_id'])
          assert body['detail'] == 'Invalid request parameters'
          PY
      - if: always()
        run: docker compose down --volumes
